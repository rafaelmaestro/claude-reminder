name: ci

# Roda em todo push e em todo PR. O objetivo numero um nao e o Windows: e nao
# deixar ninguem quebrar o X11 e o Wayland que ja funcionam.
on:
  push:
    branches: [master]
  pull_request:

jobs:
  linux:
    name: linux (guarda do X11 e do Wayland)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: dependencias graficas
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-gi gir1.2-gtk-3.0 python3-cairo
      # o mesmo script que roda na maquina de quem contribui, via scripts/check.sh
      - name: verificacoes do plugin
        run: ./scripts/check.sh

  windows:
    name: windows (o que ja e portavel)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pycairo
        run: python -m pip install --quiet pycairo
      - name: tudo compila
        run: python -m compileall -q claude-mascot
      - name: contrato do hook
        run: python claude-mascot/tests/test_hook.py
      - name: desenho do mascote roda no windows
        run: |
          python claude-mascot/overlay/mascot_win32.py --state ask  --shot ask.png
          python claude-mascot/overlay/mascot_win32.py --state done --shot done.png
      - name: janela em camadas abre de verdade
        shell: pwsh
        run: |
          $p = Start-Process python -PassThru -ArgumentList `
               "claude-mascot/overlay/mascot_win32.py","--state","ask"
          Start-Sleep -Seconds 4
          Add-Type -AssemblyName System.Windows.Forms,System.Drawing
          $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
          $bmp = New-Object Drawing.Bitmap $b.Width, $b.Height
          $g = [Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($b.Left, $b.Top, 0, 0, $bmp.Size)
          $bmp.Save("$PWD/tela.png")
          if (-not $p.HasExited) { $p.Kill() }
          Write-Host "janela criada e tela capturada"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-render
          path: |
            ask.png
            done.png
            tela.png
